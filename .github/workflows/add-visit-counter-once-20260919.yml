name: Add safe catalog visit counter

on:
  push:
    paths:
      - '.github/workflows/add-visit-counter-once-20260919.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add counter without touching catalog routing
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          hp=Path('DiGiTaL.html')
          h=hp.read_text(encoding='utf-8')
          marker='<!-- DIGITAL VISIT COUNTER v1 -->'
          if marker in h:
              raise SystemExit('ABORT: counter already installed')
          if h.count('<article class="card">') != 86:
              raise SystemExit('ABORT: expected 86 game cards')
          if h.count('</body></html>') != 1:
              raise SystemExit('ABORT: unexpected document ending')

          block=r'''
          <!-- DIGITAL VISIT COUNTER v1 -->
          <script>
          (() => {
            try {
              const key = 'digital_catalog_visitor_id';
              let id = localStorage.getItem(key);
              if (!id) {
                id = (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36));
                localStorage.setItem(key,id);
              }
              fetch('/__visit', {
                method:'POST',
                headers:{'content-type':'application/json'},
                body:JSON.stringify({id, path:location.pathname}),
                keepalive:true
              }).catch(()=>{});
            } catch(e) {}
          })();
          </script>
          '''
          h=h.replace('</body></html>',block+'\n</body></html>')
          hp.write_text(h,encoding='utf-8')

          wp=Path('_worker.js')
          w=wp.read_text(encoding='utf-8')
          if '/__visit' in w:
              raise SystemExit('ABORT: visit endpoint already exists')
          old='''    if (path === "/digital") {
                url.pathname = "/DiGiTaL.html";
                return env.ASSETS.fetch(new Request(url, request));
              }

              return env.ASSETS.fetch(request);'''
          new='''    if (path === "/__visit" && request.method === "POST") {
                let visitor = "";
                try {
                  const body = await request.json();
                  visitor = String(body.id || "").slice(0, 100);
                } catch {}
                console.log(JSON.stringify({
                  type: "catalog_visit",
                  visitor,
                  path: "/DiGiTaL",
                  country: request.cf?.country || null,
                  city: request.cf?.city || null,
                  device: request.headers.get("user-agent") || null,
                  referer: request.headers.get("referer") || null,
                  ts: new Date().toISOString()
                }));
                return new Response(null, { status: 204 });
              }

              if (path === "/digital") {
                url.pathname = "/DiGiTaL.html";
                return env.ASSETS.fetch(new Request(url, request));
              }

              return env.ASSETS.fetch(request);'''
          if old not in w:
              raise SystemExit('ABORT: stable worker block not found exactly')
          w=w.replace(old,new,1)
          wp.write_text(w,encoding='utf-8')

          cp=Path('wrangler.jsonc')
          c=cp.read_text(encoding='utf-8')
          if '"observability"' not in c:
              needle='''  "assets": {'''
              obs='''  "observability": {
                "logs": {
                  "enabled": true,
                  "invocation_logs": true,
                  "persist": true
                }
              },
              "assets": {'''
              if needle not in c: raise SystemExit('ABORT: assets config not found')
              c=c.replace(needle,obs,1)
              cp.write_text(c,encoding='utf-8')

          # Safety: never alter the deleted Presence lifecycle marker or static asset mode.
          c=cp.read_text(encoding='utf-8')
          if '"state": "deleted"' not in c or '"run_worker_first": false' not in c:
              raise SystemExit('ABORT: protected worker configuration changed')
          if hp.read_text(encoding='utf-8').count('<article class="card">') != 86:
              raise SystemExit('ABORT: game count changed')
          print('OK: isolated /__visit logger installed; 86 cards preserved; run_worker_first remains false.')
          PY

      - name: Validate scope
        shell: bash
        run: |
          set -e
          git diff --check
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' DiGiTaL.html _worker.js wrangler.jsonc | sort)"
          test "$changed" = "$expected"
          git diff --stat

      - name: Commit
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DiGiTaL.html _worker.js wrangler.jsonc
          git commit -m "Add isolated catalog visit logging"
          git push origin HEAD:main
