name: Fix DiGiTaL Search
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch search
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('DiGiTaL.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- DIGITAL SEARCH FIX v2 -->'
          if marker not in s:
              fix = r'''\n<!-- DIGITAL SEARCH FIX v2 -->\n<script>\n(function(){\n  function initSearch(){\n    const input=document.getElementById('q');\n    const grid=document.getElementById('grid');\n    const stats=document.getElementById('stats');\n    if(!input||!grid) return;\n    const cards=Array.from(grid.querySelectorAll('.card'));\n    const norm=v=>String(v||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').toLowerCase().trim();\n    const update=()=>{\n      const q=norm(input.value);\n      let shown=0;\n      cards.forEach(card=>{\n        const text=norm(card.textContent);\n        const match=!q || text.includes(q);\n        card.hidden=!match;\n        if(match) shown++;\n      });\n      if(stats) stats.textContent='🎮 Prikazano '+shown+' od '+cards.length+' igara';\n    };\n    input.addEventListener('input',update);\n    input.addEventListener('search',update);\n    update();\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',initSearch);\n  else initSearch();\n})();\n</script>\n'''
              s=s.replace('</body>', fix+'</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DiGiTaL.html
          git diff --cached --quiet || git commit -m 'Fix catalog Search'
          git push
      - name: Remove temporary workflow
        if: success()
        run: |
          rm -f .github/workflows/fix-search.yml
          git add .github/workflows/fix-search.yml
          git diff --cached --quiet || git commit -m 'Remove temporary search workflow'
          git push
