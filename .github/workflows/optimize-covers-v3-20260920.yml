name: Optimize catalog covers v3

on:
  push:
    branches:
      - optimize-covers-20260920
    paths:
      - '.github/workflows/optimize-covers-v3-20260920.yml'

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: optimize-covers-20260920
      - name: Install image tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pillow requests ddgs
      - name: Optimize covers
        run: python scripts/optimize_covers_v3.py
      - name: Validate catalog
        shell: bash
        run: |
          set -e
          test "$(grep -o '<article class="card">' DiGiTaL.html | wc -l)" -eq 86
          test "$(find covers -type f -name '*.webp' | wc -l)" -eq 86
          ! grep -q 'data:image/' DiGiTaL.html
          python - <<'PY'
          from pathlib import Path
          fs=list(Path('covers').glob('*.webp'))
          if len(fs)!=86: raise SystemExit(f'Expected 86 covers, got {len(fs)}')
          bad=[(str(p),p.stat().st_size) for p in fs if p.stat().st_size>80000]
          if bad: raise SystemExit(f'Oversized covers: {bad}')
          print('Validation OK; total KB:',round(sum(p.stat().st_size for p in fs)/1024,1),'max KB:',round(max(p.stat().st_size for p in fs)/1024,1))
          PY
          git diff --check
      - name: Commit optimized outputs on isolated branch
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DiGiTaL.html covers cover-optimization-report.md
          git commit -m "Optimize catalog cover images"
          git push origin HEAD:optimize-covers-20260920
