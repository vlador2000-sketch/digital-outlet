name: Fix UFC 3 image

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message != 'Use local compressed UFC 3 image'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace UFC 3 image source
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('DiGiTaL.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://en.wikipedia.org/wiki/Special:Redirect/file/Conor_McGregor_2018.jpg'
          new = 'assets/ufc3.jpg'
          if old not in s:
              raise SystemExit('Expected UFC 3 image source was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DiGiTaL.html
          git diff --cached --quiet || git commit -m 'Use local compressed UFC 3 image'
          git push
