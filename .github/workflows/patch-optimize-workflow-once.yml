name: Patch cover optimizer once

on:
  push:
    branches:
      - optimize-covers-20260920
    paths:
      - '.github/workflows/patch-optimize-workflow-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: optimize-covers-20260920
          fetch-depth: 0
      - name: Patch and push
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/optimize-covers-20260920.yml')
          s=p.read_text()
          old='          used_names={}\n'
          new='          used_names=set()\n'
          if old not in s:
              raise SystemExit('Expected line not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/optimize-covers-20260920.yml
          git commit -m "Fix cover optimizer set initialization"
          git push origin HEAD:optimize-covers-20260920
