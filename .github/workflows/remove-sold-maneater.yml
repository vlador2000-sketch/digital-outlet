name: Remove sold MANEATER

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  clean-catalog:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove MANEATER card from catalog
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('DiGiTaL.html')
          html = path.read_text(encoding='utf-8')
          low = html.lower()

          start = 0
          removed = False
          while True:
              start = low.find('<article class="card">', start)
              if start < 0:
                  break
              end = low.find('</article>', start)
              if end < 0:
                  break
              end += len('</article>')
              card = low[start:end]
              if 'alt="maneater"' in card and '<div class="game">maneater</div>' in card:
                  html = html[:start] + html[end:]
                  removed = True
                  break
              start = end

          if not removed:
              raise SystemExit('MANEATER card was not found; no commit made.')

          path.write_text(html, encoding='utf-8')
          print('MANEATER removed from DiGiTaL.html')
          PY

      - name: Commit cleaned catalog
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DiGiTaL.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove sold Maneater from catalog'
          git push
