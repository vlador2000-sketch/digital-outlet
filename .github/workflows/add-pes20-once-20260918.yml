name: Add PES 20 safely

on:
  push:
    paths:
      - '.github/workflows/add-pes20-once-20260918.yml'

permissions:
  contents: write

jobs:
  add:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add only PES 20 card and validate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('DiGiTaL.html')
          text = path.read_text(encoding='utf-8')
          marker = '<article class="card">'
          target = '<div class="game">PES 20</div>'

          before_cards = text.count(marker)
          if before_cards != 85:
              raise SystemExit(f'ABORT: expected 85 cards before addition, found {before_cards}')
          if target in text:
              raise SystemExit('ABORT: PES 20 already exists')

          # Clone the structure of the last normal catalog card, then replace its visible game-specific content.
          starts = [m.start() for m in re.finditer(re.escape(marker), text)]
          if not starts:
              raise SystemExit('ABORT: no catalog cards found')
          start = starts[-1]
          next_close = text.find('</article>', start)
          if next_close < 0:
              raise SystemExit('ABORT: last card closing tag not found')
          end = next_close + len('</article>')
          template = text[start:end]

          # Keep existing proven card markup/classes. Use a lightweight generated cover so no third-party hotlink is required.
          card = template
          card = re.sub(r'<div class="game">.*?</div>', target, card, count=1, flags=re.S)
          card = re.sub(r'<div class="price">.*?</div>', '<div class="price">10€</div>', card, count=1, flags=re.S)
          card = re.sub(r'<div class="platform">.*?</div>', '<div class="platform">PS4</div>', card, count=1, flags=re.S)

          cover_svg = """<svg xmlns='http://www.w3.org/2000/svg' width='600' height='800' viewBox='0 0 600 800'><rect width='600' height='800' fill='%23091424'/><text x='300' y='330' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-weight='700' font-size='92'>PES 20</text><text x='300' y='410' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-size='38'>eFootball</text><text x='300' y='690' text-anchor='middle' fill='white' font-family='Arial,sans-serif' font-size='32'>PS4</text></svg>"""
          import urllib.parse
          cover = 'data:image/svg+xml,' + urllib.parse.quote(cover_svg, safe="'(),")
          card = re.sub(r'(<img\b[^>]*class="cover"[^>]*\bsrc=")[^"]*(")', r'\1' + cover + r'\2', card, count=1, flags=re.S)

          if target not in card or '<div class="price">10€</div>' not in card:
              raise SystemExit('ABORT: failed to construct PES 20 card')

          new_text = text[:end] + '\n' + card + text[end:]
          after_cards = new_text.count(marker)
          checks = {
              'card count increased by one': after_cards == 86,
              'PES 20 added once': new_text.count(target) == 1,
              'price 10 present in PES card': '<div class="price">10€</div>' in card,
              'search input preserved': 'id="q"' in new_text,
              'grid preserved': 'id="grid" class="grid"' in new_text,
              'document closes once': new_text.count('</body></html>') == 1,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('ABORT: validation failed: ' + ', '.join(failed))

          path.write_text(new_text, encoding='utf-8')
          print('OK: PES 20 added at 10€; 85 -> 86 cards.')
          PY

      - name: Validate diff scope
        shell: bash
        run: |
          set -e
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "DiGiTaL.html"
          git diff --stat

      - name: Commit addition
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DiGiTaL.html
          git commit -m "Add PES 20 to catalog at 10 euro"
          git push origin HEAD:main
