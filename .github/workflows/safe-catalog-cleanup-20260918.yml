name: Safe catalog cleanup

on:
  push:
    paths:
      - '.github/workflows/safe-catalog-cleanup-20260918.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clean duplicate search script safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('DiGiTaL.html')
          text = path.read_text(encoding='utf-8')
          original = text

          card_count_before = text.count('<article class="card"')
          if card_count_before < 80:
              raise SystemExit(f'ABORT: unexpected card count: {card_count_before}')

          marker = r'\n<!-- DIGITAL SEARCH FIX v2 -->\n<script>\n'
          if text.count(marker) != 1:
              raise SystemExit(f'ABORT: duplicate-script marker count is {text.count(marker)}, expected 1')

          end_tag = '</body></html>'
          marker_pos = text.index(marker)
          end_pos = text.rfind(end_tag)
          if end_pos <= marker_pos:
              raise SystemExit('ABORT: malformed end of document')

          # Remove only the malformed duplicate block. Keep the valid search script above it.
          text = text[:marker_pos] + '\n' + text[end_pos:]

          old_stats = '<p class="stats" id="stats">🎮 Prikazano 87 od 87 igara</p>'
          new_stats = '<p class="stats" id="stats">🎮 Učitavanje kataloga…</p>'
          if text.count(old_stats) == 1:
              text = text.replace(old_stats, new_stats, 1)

          checks = {
              'card count unchanged': text.count('<article class="card"') == card_count_before,
              'main search script remains': "const cards=Array.from(grid.querySelectorAll('.card'));" in text,
              'duplicate marker removed': 'DIGITAL SEARCH FIX v2' not in text,
              'document closes once': text.count('</body></html>') == 1,
              'grid remains': 'id="grid" class="grid"' in text,
              'search input remains': 'id="q"' in text,
          }
          failed = [name for name, ok in checks.items() if not ok]
          if failed:
              raise SystemExit('ABORT: validation failed: ' + ', '.join(failed))

          if text == original:
              raise SystemExit('ABORT: no intended change was made')

          path.write_text(text, encoding='utf-8')
          print(f'OK: {card_count_before} cards preserved; malformed duplicate script removed.')
          PY

      - name: Validate diff scope
        shell: bash
        run: |
          set -e
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "DiGiTaL.html"
          git diff --stat

      - name: Commit safe cleanup
        shell: bash
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DiGiTaL.html
          git commit -m "Safely clean duplicate catalog script"
          git push origin HEAD:main
